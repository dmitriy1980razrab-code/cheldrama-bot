server_tokens off;
client_header_timeout 10s;
client_body_timeout 10s;
keepalive_timeout 15s;
send_timeout 15s;

limit_req_zone $binary_remote_addr zone=cheldrama_chat:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=cheldrama_per_ip:10m;
limit_conn_zone $server_name zone=cheldrama_total:1m;
